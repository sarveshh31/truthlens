name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-retrieval-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: truthlens
          POSTGRES_PASSWORD: truthlens
          POSTGRES_DB: truthlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truthlens -d truthlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://truthlens:truthlens@127.0.0.1:5432/truthlens
      LLM_PROVIDER: groq
      GROQ_API_KEY: not-used-in-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch (much smaller than the default build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt reportlab

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-v1.5-minilm-l6-v2

      - name: Unit tests
        run: pytest -q

      - name: Build the fictional demo PDF
        run: python scripts/make_demo_pdf.py data/vantora_demo.pdf

      - name: Retrieval regression check
        run: python scripts/ci_retrieval_check.py