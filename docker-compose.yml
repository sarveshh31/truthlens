services:
  db:
    image: pgvector/pgvector:pg16
    container_name: truthlens-db
    environment:
      POSTGRES_USER: truthlens
      POSTGRES_PASSWORD: truthlens
      POSTGRES_DB: truthlens
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthlens -d truthlens"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: truthlens-api
    env_file: .env
    environment:
      # inside Docker the database host is the service name "db", not 127.0.0.1
      DATABASE_URL: postgresql://truthlens:truthlens@db:5434/truthlens
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata: